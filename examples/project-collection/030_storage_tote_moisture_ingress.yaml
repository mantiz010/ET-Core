blueprint:
  name: ET-Core · Storage tote moisture ingress
  domain: automation
  description: 'Use the ET-Core BME280 firmware. Select relative humidity (%). Default
    trigger: above 60, held for 30 minutes.'
  input:
    source:
      name: relative humidity (%)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 60
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Storage tote moisture ingress
          message: relative humidity (%) reached the configured condition for 30 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  above: !input threshold
  for:
    minutes: 30
action: !input response
mode: single
