blueprint:
  name: ET-Core · Raised bed rain penetration
  domain: automation
  description: 'Use the ET-Core SoilMoisture firmware. Select calibrated soil moisture
    (%). Default trigger: above 65, held for 5 minutes.'
  input:
    source:
      name: calibrated soil moisture (%)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 65
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Raised bed rain penetration
          message: calibrated soil moisture (%) reached the configured condition for
            5 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  above: !input threshold
  for:
    minutes: 5
action: !input response
mode: single
