blueprint:
  name: ET-Core · Greenhouse overnight saturation
  domain: automation
  description: 'Use the ET-Core BME280 firmware. Select relative humidity (%). Default
    trigger: above 90, held for 15 minutes.'
  input:
    source:
      name: relative humidity (%)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 90
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Greenhouse overnight saturation
          message: relative humidity (%) reached the configured condition for 15 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  above: !input threshold
  for:
    minutes: 15
action: !input response
mode: single
