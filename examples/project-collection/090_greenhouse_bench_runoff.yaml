blueprint:
  name: ET-Core · Greenhouse bench runoff
  domain: automation
  description: 'Use the ET-Core WaterLeak firmware. Select wet contact. Default trigger:
    on, held for 2 minutes.'
  input:
    source:
      name: wet contact
      selector:
        entity:
          domain: binary_sensor
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Greenhouse bench runoff
          message: wet contact reached the configured condition for 2 min.
      selector:
        action: {}
trigger:
- platform: state
  entity_id: !input source
  from: 'off'
  to: 'on'
  for:
    minutes: 2
action: !input response
mode: single
