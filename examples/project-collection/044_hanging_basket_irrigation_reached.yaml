blueprint:
  name: ET-Core · Hanging basket irrigation reached
  domain: automation
  description: 'Use the ET-Core SoilMoisture firmware. Select calibrated soil moisture
    (%). Default trigger: above 60, held for 2 minutes.'
  input:
    source:
      name: calibrated soil moisture (%)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 60
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Hanging basket irrigation reached
          message: calibrated soil moisture (%) reached the configured condition for
            2 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  above: !input threshold
  for:
    minutes: 2
action: !input response
mode: single
