blueprint:
  name: ET-Core · Workshop warmed for painting
  domain: automation
  description: 'Use the ET-Core DS18B20 firmware. Select probe temperature (°C). Default
    trigger: above 18, held for 15 minutes.'
  input:
    source:
      name: probe temperature (°C)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 18
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Workshop warmed for painting
          message: probe temperature (°C) reached the configured condition for 15
            min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  above: !input threshold
  for:
    minutes: 15
action: !input response
mode: single
