blueprint:
  name: ET-Core · Hydroponic reservoir top-up
  domain: automation
  description: 'Use the ET-Core TankLevel firmware. Select calibrated level (%). Default
    trigger: below 35, held for 3 minutes.'
  input:
    source:
      name: calibrated level (%)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 35
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Hydroponic reservoir top-up
          message: calibrated level (%) reached the configured condition for 3 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  below: !input threshold
  for:
    minutes: 3
action: !input response
mode: single
