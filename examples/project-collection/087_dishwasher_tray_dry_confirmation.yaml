blueprint:
  name: ET-Core · Dishwasher tray dry confirmation
  domain: automation
  description: 'Use the ET-Core WaterLeak firmware. Select wet contact. Default trigger:
    off, held for 20 minutes.'
  input:
    source:
      name: wet contact
      selector:
        entity:
          domain: binary_sensor
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Dishwasher tray dry confirmation
          message: wet contact reached the configured condition for 20 min.
      selector:
        action: {}
trigger:
- platform: state
  entity_id: !input source
  from: 'on'
  to: 'off'
  for:
    minutes: 20
action: !input response
mode: single
