blueprint:
  name: ET-Core · Pantry inactivity reminder
  domain: automation
  description: 'Use the ET-Core MotionPIR firmware. Select motion. Default trigger:
    off, held for 5 minutes.'
  input:
    source:
      name: motion
      selector:
        entity:
          domain: binary_sensor
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Pantry inactivity reminder
          message: motion reached the configured condition for 5 min.
      selector:
        action: {}
trigger:
- platform: state
  entity_id: !input source
  from: 'on'
  to: 'off'
  for:
    minutes: 5
action: !input response
mode: single
