blueprint:
  name: ET-Core · Desktop pump sustained run
  domain: automation
  description: 'Use the ET-Core INA219 firmware. Select DC load power (W). Default
    trigger: above 2, held for 10 minutes.'
  input:
    source:
      name: DC load power (W)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 2
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Desktop pump sustained run
          message: DC load power (W) reached the configured condition for 10 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  above: !input threshold
  for:
    minutes: 10
action: !input response
mode: single
