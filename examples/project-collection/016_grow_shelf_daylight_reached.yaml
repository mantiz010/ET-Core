blueprint:
  name: ET-Core · Grow shelf daylight reached
  domain: automation
  description: 'Use the ET-Core BH1750 firmware. Select illuminance (lx). Default
    trigger: above 5000, held for 10 minutes.'
  input:
    source:
      name: illuminance (lx)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 5000
      selector:
        number:
          min: 0
          max: 20000
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Grow shelf daylight reached
          message: illuminance (lx) reached the configured condition for 10 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  above: !input threshold
  for:
    minutes: 10
action: !input response
mode: single
