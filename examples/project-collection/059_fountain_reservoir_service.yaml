blueprint:
  name: ET-Core · Fountain reservoir service
  domain: automation
  description: 'Use the ET-Core TankLevel firmware. Select calibrated level (%). Default
    trigger: below 25, held for 5 minutes.'
  input:
    source:
      name: calibrated level (%)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 25
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Fountain reservoir service
          message: calibrated level (%) reached the configured condition for 5 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  below: !input threshold
  for:
    minutes: 5
action: !input response
mode: single
