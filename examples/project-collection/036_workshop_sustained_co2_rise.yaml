blueprint:
  name: ET-Core · Workshop sustained CO2 rise
  domain: automation
  description: 'Use the ET-Core SCD40 firmware. Select carbon dioxide (ppm). Default
    trigger: above 1300, held for 15 minutes.'
  input:
    source:
      name: carbon dioxide (ppm)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 1300
      selector:
        number:
          min: 0
          max: 5000
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Workshop sustained CO2 rise
          message: carbon dioxide (ppm) reached the configured condition for 15 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  above: !input threshold
  for:
    minutes: 15
action: !input response
mode: single
