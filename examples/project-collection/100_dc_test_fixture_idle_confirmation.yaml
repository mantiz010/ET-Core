blueprint:
  name: ET-Core · DC test fixture idle confirmation
  domain: automation
  description: 'Use the ET-Core INA219 firmware. Select DC load power (W). Default
    trigger: below 0.25, held for 2 minutes.'
  input:
    source:
      name: DC load power (W)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 0.25
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: DC test fixture idle confirmation
          message: DC load power (W) reached the configured condition for 2 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  below: !input threshold
  for:
    minutes: 2
action: !input response
mode: single
