blueprint:
  name: ET-Core · Brew water preheat milestone
  domain: automation
  description: 'Use the ET-Core DS18B20 firmware. Select probe temperature (°C). Default
    trigger: above 65, held for 1 minutes.'
  input:
    source:
      name: probe temperature (°C)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 65
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Brew water preheat milestone
          message: probe temperature (°C) reached the configured condition for 1 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  above: !input threshold
  for:
    minutes: 1
action: !input response
mode: single
