blueprint:
  name: ET-Core · Boot tray drying complete
  domain: automation
  description: 'Use the ET-Core WaterLeak firmware. Select wet contact. Default trigger:
    off, held for 30 minutes.'
  input:
    source:
      name: wet contact
      selector:
        entity:
          domain: binary_sensor
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Boot tray drying complete
          message: wet contact reached the configured condition for 30 min.
      selector:
        action: {}
trigger:
- platform: state
  entity_id: !input source
  from: 'on'
  to: 'off'
  for:
    minutes: 30
action: !input response
mode: single
