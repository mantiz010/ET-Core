blueprint:
  name: ET-Core · Instrument cupboard humidity dip
  domain: automation
  description: 'Use the ET-Core BME280 firmware. Select relative humidity (%). Default
    trigger: below 40, held for 20 minutes.'
  input:
    source:
      name: relative humidity (%)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 40
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Instrument cupboard humidity dip
          message: relative humidity (%) reached the configured condition for 20 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  below: !input threshold
  for:
    minutes: 20
action: !input response
mode: single
