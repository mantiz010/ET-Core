blueprint:
  name: ET-Core · Reading desk light check
  domain: automation
  description: 'Use the ET-Core BH1750 firmware. Select illuminance (lx). Default
    trigger: below 300, held for 3 minutes.'
  input:
    source:
      name: illuminance (lx)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 300
      selector:
        number:
          min: 0
          max: 20000
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Reading desk light check
          message: illuminance (lx) reached the configured condition for 3 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  below: !input threshold
  for:
    minutes: 3
action: !input response
mode: single
