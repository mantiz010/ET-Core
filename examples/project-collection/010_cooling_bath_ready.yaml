blueprint:
  name: ET-Core · Cooling bath ready
  domain: automation
  description: 'Use the ET-Core DS18B20 firmware. Select probe temperature (°C). Default
    trigger: below 10, held for 2 minutes.'
  input:
    source:
      name: probe temperature (°C)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 10
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Cooling bath ready
          message: probe temperature (°C) reached the configured condition for 2 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  below: !input threshold
  for:
    minutes: 2
action: !input response
mode: single
