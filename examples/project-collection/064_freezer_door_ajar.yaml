blueprint:
  name: ET-Core · Freezer door ajar
  domain: automation
  description: 'Use the ET-Core DoorContact firmware. Select contact. Default trigger:
    on, held for 2 minutes.'
  input:
    source:
      name: contact
      selector:
        entity:
          domain: binary_sensor
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Freezer door ajar
          message: contact reached the configured condition for 2 min.
      selector:
        action: {}
trigger:
- platform: state
  entity_id: !input source
  from: 'off'
  to: 'on'
  for:
    minutes: 2
action: !input response
mode: single
