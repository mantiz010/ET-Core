blueprint:
  name: ET-Core · Rehearsal room air break
  domain: automation
  description: 'Use the ET-Core SCD40 firmware. Select carbon dioxide (ppm). Default
    trigger: above 1400, held for 5 minutes.'
  input:
    source:
      name: carbon dioxide (ppm)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 1400
      selector:
        number:
          min: 0
          max: 5000
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Rehearsal room air break
          message: carbon dioxide (ppm) reached the configured condition for 5 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  above: !input threshold
  for:
    minutes: 5
action: !input response
mode: single
