blueprint:
  name: ET-Core · Irrigation tote emptying
  domain: automation
  description: 'Use the ET-Core TankLevel firmware. Select calibrated level (%). Default
    trigger: below 10, held for 2 minutes.'
  input:
    source:
      name: calibrated level (%)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 10
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Irrigation tote emptying
          message: calibrated level (%) reached the configured condition for 2 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  below: !input threshold
  for:
    minutes: 2
action: !input response
mode: single
