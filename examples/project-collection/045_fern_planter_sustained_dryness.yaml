blueprint:
  name: ET-Core · Fern planter sustained dryness
  domain: automation
  description: 'Use the ET-Core SoilMoisture firmware. Select calibrated soil moisture
    (%). Default trigger: below 40, held for 20 minutes.'
  input:
    source:
      name: calibrated soil moisture (%)
      selector:
        entity:
          domain: sensor
    threshold:
      name: Threshold
      default: 40
      selector:
        number:
          min: 0
          max: 125
          step: 0.01
          mode: box
    response:
      name: When triggered
      default:
      - service: persistent_notification.create
        data:
          title: Fern planter sustained dryness
          message: calibrated soil moisture (%) reached the configured condition for
            20 min.
      selector:
        action: {}
trigger:
- platform: numeric_state
  entity_id: !input source
  below: !input threshold
  for:
    minutes: 20
action: !input response
mode: single
