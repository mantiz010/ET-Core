<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ET-Core</title>
  <style>
    :root {
      --bg: #081018;
      --panel: #111b25;
      --panel2: #172331;
      --line: #2b3b4d;
      --text: #edf5ff;
      --muted: #8ea3b8;
      --blue: #25a7f0;
      --good: #35d07f;
      --bad: #ff5e5e;
      --warn: #f0bd45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      background: rgba(8, 16, 24, 0.96);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    button {
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
    }
    main { padding: 20px; display: grid; gap: 18px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 12px;
    }
    .stat, .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .stat { padding: 14px; }
    .label { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
    .section h2 {
      margin: 0;
      padding: 14px 16px;
      font-size: 15px;
      border-bottom: 1px solid var(--line);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(43, 59, 77, 0.7); font-size: 13px; }
    th { color: var(--muted); font-weight: 600; }
    .pill {
      display: inline-flex;
      align-items: center;
      min-width: 68px;
      justify-content: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      border: 1px solid var(--line);
    }
    .online { color: var(--good); border-color: rgba(53, 208, 127, 0.45); }
    .offline { color: var(--bad); border-color: rgba(255, 94, 94, 0.45); }
    .events { padding: 8px 0; max-height: 360px; overflow: auto; }
    .event {
      display: grid;
      grid-template-columns: 90px 100px 1fr 120px;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(43, 59, 77, 0.45);
      font-size: 13px;
    }
    .muted { color: var(--muted); }
    .empty { padding: 18px; color: var(--muted); }
    @media (max-width: 800px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      header { align-items: flex-start; flex-direction: column; }
      .event { grid-template-columns: 1fr; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>ET-Core Network</h1>
      <div class="sub" id="status">Loading diagnostics...</div>
    </div>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <main>
    <section class="stats">
      <div class="stat"><div class="label">Devices</div><div class="value" id="devices">0</div></div>
      <div class="stat"><div class="label">Online</div><div class="value" id="online">0</div></div>
      <div class="stat"><div class="label">RX Packets</div><div class="value" id="rx">0</div></div>
      <div class="stat"><div class="label">Decrypt Fails</div><div class="value" id="fails">0</div></div>
    </section>
    <section class="section">
      <h2>Devices</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Status</th><th>Class</th><th>Name</th><th>IP</th><th>RSSI</th><th>Seen</th><th>Lease</th><th>FW</th>
          </tr>
        </thead>
        <tbody id="deviceRows"></tbody>
      </table>
    </section>
    <section class="section">
      <h2>Events</h2>
      <div class="events" id="events"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const ago = (sec) => sec == null ? "" : `${Math.max(0, Number(sec)).toFixed(1)}s`;

    // This page runs in Home Assistant's sidebar iframe (same origin). An iframe
    // sends no auth header, so take the logged-in user's token from the HA
    // frontend around it; the diagnostics API itself stays authenticated.
    function haToken() {
      try {
        return window.parent.document.querySelector("home-assistant").hass.auth.data.access_token;
      } catch (e) {
        return null;
      }
    }

    async function load() {
      const token = haToken();
      const res = await fetch("/etcore/api/diag", {
        cache: "no-store",
        headers: token ? { Authorization: `Bearer ${token}` } : {},
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const hub = data.hubs?.[0] || { devices: [], events: [] };
      const devices = hub.devices || [];
      const online = devices.filter(d => d.online).length;
      $("devices").textContent = devices.length;
      $("online").textContent = online;
      $("rx").textContent = hub.rx_count || 0;
      $("fails").textContent = hub.decrypt_failures || 0;
      $("status").textContent = `Encryption ${hub.encrypted ? "enabled" : "off"} | replays dropped ${hub.replays_dropped || 0}` +
        ` | unproven ${hub.unproven_dropped || 0} | commands failed ${hub.commands_failed || 0}` +
        ` | ${new Date().toLocaleTimeString()}`;

      $("deviceRows").innerHTML = devices.length ? devices.map(d => `
        <tr>
          <td>${esc(d.id)}</td>
          <td><span class="pill ${d.online ? "online" : "offline"}">${d.online ? "online" : "offline"}</span></td>
          <td>${esc(d.class)}</td>
          <td>${esc(d.name || d.id)}</td>
          <td>${esc(d.last_addr)}</td>
          <td>${esc(d.rssi ?? "")}</td>
          <td>${ago(d.age)}</td>
          <td>${ago(d.expires_in)}</td>
          <td>${esc(d.fw || "")}</td>
        </tr>
      `).join("") : `<tr><td colspan="9" class="empty">No ET-Core devices seen yet.</td></tr>`;

      $("events").innerHTML = (hub.events || []).length ? hub.events.map(e => `
        <div class="event">
          <div class="muted">${new Date((e.ts || 0) * 1000).toLocaleTimeString()}</div>
          <div>${esc(e.type || e.status)}</div>
          <div>${esc(e.id)} <span class="muted">${esc(e.class || e.reason || "")}</span></div>
          <div class="muted">${esc(e.src || "")}${e.encrypted ? " enc" : ""}</div>
        </div>
      `).join("") : `<div class="empty">No events yet.</div>`;
    }

    $("refresh").addEventListener("click", load);
    load().catch(err => $("status").textContent = `Diagnostics failed: ${err.message}`);
    setInterval(() => load().catch(() => {}), 2000);
  </script>
</body>
</html>
